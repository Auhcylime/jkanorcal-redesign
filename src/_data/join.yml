faq:
  label: "FAQ"
  heading: "Common Questions"
  image: "/images/faq-competition.jpg"
  image_alt: "JKA NorCal competitors after a kumite match"
  items:
    - q: "Who can join? Is this just for kids?"
      a: "Everyone is welcome. We train students of all ages from 5 and up. Children under 14 join our Youth classes, and from age 14 onwards students train in the Adult classes."
    - q: "How do I sign up?"
      a: 'We encourage you to start with a free trial so we can find the right fit for you before you commit. We offer monthly, 3-month, and annual plans, and you can sign up and pay <a href="https://app.jackrabbitclass.com/regv2.asp?id=557815&preLoadClassID=21217866" target="_blank" rel="noopener">here</a>.'
    - q: "What do I need to wear and bring?"
      a: "Just comfortable sports attire and a water bottle to start. Training is done barefoot on the mats. You're welcome to wear your own plain white, unmarked gi, or purchase one from us for $75, available on site."
    - q: "How much physical contact is involved? Is there sparring?"
      a: "Beginner classes focus on fundamentals with little to no contact. As students progress, more advanced classes introduce controlled contact and sparring in a safe, supervised setting."
    - q: "How athletic do I need to be to start?"
      a: "You don't need any prior fitness or experience. Karate builds your strength, coordination, and conditioning over time, and we'll meet you where you are. If you have any injuries or need accommodations, just let your instructor know before class begins."
    - q: "What does JKA stand for?"
      a: "JKA is the Japan Karate Association. Our dojo is affiliated with the JKA, which means your membership lets you train at any JKA-affiliated dojo anywhere in the world."
    - q: "How do we stay in touch?"
      a: "Our main communication channel is Slack. Once you join, we'll send a Slack invite to your email."
