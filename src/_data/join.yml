faq:
  label: "FAQ"
  heading: "Common Questions"
  image: "/images/join/faq-competition.jpg"
  image_alt: "JKA NorCal competitors after a kumite match"
  items:
    - q: "Who can join?"
      a: "Everyone from age 5 and up. Under 14 train in our Youth classes; 14 and up join the Adult classes."
    - q: "How do I sign up?"
      a: 'Start with a free trial so we can find the right fit. We offer monthly, 3-month, and annual plans, and you can sign up and pay <a href="https://app.jackrabbitclass.com/regv2.asp?id=557815&preLoadClassID=21217866" target="_blank" rel="noopener">here</a>.'
    - q: "What do I wear and bring?"
      a: "Comfortable sports attire and a water bottle. Training is barefoot on the mats. Wear your own plain white gi, or buy one from us for $75 on site."
    - q: "Is there sparring?"
      a: "Beginner classes focus on fundamentals with little to no contact. As students progress, more advanced classes introduce controlled contact and sparring in a safe, supervised setting."
    - q: "Do I need to be fit to start?"
      a: "No prior fitness or experience needed: karate builds strength and conditioning over time, and we meet you where you are. Let your instructor know about any injuries before class."
    - q: "What does JKA stand for?"
      a: "JKA is the Japan Karate Association. Our dojo is affiliated with the JKA, which means your membership lets you train at any JKA-affiliated dojo anywhere in the world."
    - q: "How do we stay in touch?"
      a: "Our main communication channel is Slack. Once you join, we'll send a Slack invite to your email."
