# Hero (full-bleed photo with overlay text and CTAs).
hero:
  image: "https://jkanorcal.org/wp-content/uploads/2025/11/20251025-DRG_3838-860x573.jpg"
  image_alt: "Karate training at JKA Northern California"
  heading_line1: "Shotokan Karate in"
  heading_line2: "San Bruno"
  subhead: "Authentic JKA training for adults and kids, five days a week. Twenty minutes south of San Francisco."
  cta_primary:
    label: "Join Us"
    href: "https://app.jackrabbitclass.com/regv2.asp?id=557815&preLoadClassID=21217866"
    external: true
  cta_secondary:
    label: "See Class Schedule"
    href: "#schedule"

# 4 thumbnails directly under the hero.
photo_strip:
  - image: "/images/strip-1-kids-belts.jpg"
    alt: "Kids program graduation with new belts"
  - image: "/images/strip-3-class.jpg"
    alt: "Partner training in the dojo"
  - image: "/images/strip-4-group.jpg"
    alt: "Sensei and students at Los Angeles JKA visit"
  - image: "/images/strip-2-kata-kids.jpg"
    alt: "Kids practicing kata in the dojo"

# About the dojo section. Each paragraph supports a single inline link.
about:
  label: "About the Dojo"
  heading: "Training here since the beginning"
  paragraphs:
    - 'JKA of Northern California is the Bay Area''s home for Shotokan karate, affiliated with the <a href="https://www.jkaaf.com" target="_blank" rel="noopener" class="text-link">Japan Karate Association American Federation</a>. Our dojo in San Bruno has served the community for decades, developing students of all ages through traditional, rigorous training.'
    - 'The curriculum follows JKA methodology: correct form, strong technique, and the development of character. Beginners and experienced karateka train side by side.'
  cta:
    label: "View Class Schedule"
    href: "#schedule"
  photo: "https://jkanorcal.org/wp-content/uploads/2025/11/casual-hirayama-class-friday-860x573.jpg"
  photo_alt: "Friday class at the dojo"

# Funakoshi quote banner.
quote:
  text: "The ultimate aim of karate lies not in victory nor defeat, but in the perfection of the character of its participants."
  attribution: "— Gichin Funakoshi"

# Instructors feature section (photo + heading + paragraph + 3 stats).
feature:
  photo: "/images/about-usa-team.jpg"
  photo_alt: "JKA Karate USA Team at the World Championships"
  label: "Instructors"
  heading_line1: "Taught by certified"
  heading_line2: "black belts"
  body: "Our instructors hold JKA-certified ranks and have trained under some of the most respected masters in the Shotokan tradition. In October 2025, we hosted Yuko Hirayama Sensei — 7th Dan from JKA Headquarters in Tokyo — for our first-ever training camp."
  stats:
    - { value: "5",   label: "Days / week" }
    - { value: "40+", label: "Years" }
    - { value: "JKA", label: "Affiliated" }

# Updates / Instagram section. Embed is the LightWidget id.
updates:
  label: "Updates"
  heading: "From the dojo's Instagram"
  description: 'Camp news, competition moments, and class highlights, straight from <a href="https://instagram.com/jkanorcal" target="_blank" rel="noopener">@jkanorcal</a>.'
  follow_button:
    label: "Follow on Instagram"
    href: "https://instagram.com/jkanorcal"
  lightwidget_id: "2b4c3aaed9a059fc933a292ca0262e1c"

# Recognition section (dark band).
recognition:
  photo: "https://jkanorcal.org/wp-content/uploads/2025/10/Sammi-with-Trophies.jpeg"
  photo_alt: "Sammi Yeung with her Panamerican trophies"
  caption: "Sammi · Panam Trophies, 2025"
  label: "Recognition"
  heading: 'Home of the <em>2025 Panamerican Kata Champion</em>, Sammi Yeung, and a roster of athletes who train and compete on the world floor.'
  body: "JKA NorCal is also proud to have had Sensei Wauriman, Harry Rahn, Abdallah and Amir Batshon, and Sensei Christina Foo represent the United States and Julia Ip represent Canada. Our dojo continues to produce high-level competitors in both kata and kumite that make their marks at the world level."

