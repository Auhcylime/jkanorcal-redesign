recognition:
  photo: /images/home/home-recognition-sammi.jpg
  photo_alt: Sammi Yeung with her Panamerican trophies
  caption: Sammi · Panam Trophies, 2025
  label: Recognition
  heading: Home of the <em>2025 Panamerican Kata Champion</em>, Sammi Yeung, and a roster of athletes who train and compete on the world floor.
  body: JKA NorCal is also proud to have had Sensei Wauriman, Harry Rahn, Abdallah and Amir Batshon, and Sensei Christina Foo represent the United States and Julia Ip represent Canada. Our dojo continues to produce high-level competitors in both kata and kumite that make their marks at the world level.
