# Privacy Policy page content.
# Edit the text here to update the published privacy policy.
# - `meta` controls the browser tab title and the search-engine description.
# - `header` is the small label + big page heading at the top.
# - `sections` is the body: an ordered list of policy sections. Each has:
#     heading: the section title shown on the page
#     level:   2 for a main section, 3 for a sub-section (smaller heading)
#     body:    the section's paragraphs/lists as HTML (may be empty)
#   To add a section, copy a block and keep the same indentation.
#   IMPORTANT: text inside `body` is HTML — keep tags like <p>, <ul>, <li>,
#   <a>, <strong> and entities (e.g. &amp;) intact, exactly as written.

# Browser tab title + meta description (SEO)
meta:
  title: "Privacy Policy | JKA NorCal"
  description: "How JKA NorCal collects, uses, and protects your data, and the rights you have."

# Top-of-page label and heading
header:
  label: "Legal"
  heading: "Privacy Policy"

# Policy sections, rendered in order
sections:
  - heading: "Who we are"
    level: 2
    body: |-
      <p>JKA NorCal is a JKA-affiliated Shotokan Karate club based in San Bruno near San Francisco, CA. Our website address is <a href="https://jkanorcal.org">https://jkanorcal.org</a>.</p>

  - heading: "What personal data we collect and why we collect it"
    level: 2
    body: |-
      <p>While you visit the tournament registration site, we'll track:</p>
      <ul>
        <li>Events you've viewed: we'll use this to, for example, show you events you've recently viewed.</li>
        <li>Location, IP address, and browser type: we'll use this for purposes like estimating taxes and shipping.</li>
        <li>Shipping address: we'll ask you to enter this so we can, for instance, send you confirmation of your registration, or contact you if there are problems.</li>
      </ul>
      <p>We'll also use cookies to keep track of cart contents while you're browsing our site.</p>
      <p>When you register for a tournament, we'll ask you to provide information including your name, billing address, shipping address, email address, phone number, credit card / payment details, and optional account information like username and password. We'll use this information for purposes such as:</p>
      <ul>
        <li>Sending you information about your account and order.</li>
        <li>Responding to your requests, including refunds and complaints.</li>
        <li>Verifying that you are registered for the correct events.</li>
        <li>Processing payments and preventing fraud.</li>
        <li>Setting up your account for our store.</li>
        <li>Complying with any legal obligations we have, such as calculating taxes.</li>
      </ul>
      <p>If you create an account, we will store your name, address, email, and phone number, which will be used to populate the checkout for future orders.</p>
      <p>We generally store information about you for as long as we need the information for the purposes for which we collect and use it, and we are not legally required to continue to keep it. For example, we will store order information for 3 years for tax and accounting purposes. This includes your name, email address, and billing and shipping addresses.</p>
      <p>We will also store comments or reviews, if you choose to leave them.</p>

  - heading: "Comments"
    level: 2
    body: |-
      <p>When visitors leave comments on the site we collect the data shown in the comments form, and also the visitor's IP address and browser user agent string to help spam detection.</p>
      <p>An anonymized string created from your email address (also called a hash) may be provided to the Gravatar service to see if you are using it. The Gravatar service privacy policy is available at <a href="https://automattic.com/privacy/" target="_blank" rel="noopener">https://automattic.com/privacy/</a>. After approval of your comment, your profile picture is visible to the public in the context of your comment.</p>

  - heading: "Media"
    level: 2
    body: |-
      <p>If you upload images to the website, you should avoid uploading images with embedded location data (EXIF GPS) included. We attempt to scrub all EXIF data from images, but for various reasons this does not always succeed, so visitors to the website may be able to download and extract location data from images on the website.</p>

  - heading: "Contact forms"
    level: 2
    body: |-
      <p>Information you enter on forms on this website will be saved on this server. Additionally, it may be sent in email to you and the site administrators. See below for the length of time this information is retained.</p>

  - heading: "Cookies"
    level: 2
    body: |-
      <p>If you leave a comment on our site you may opt-in to saving your name, email address, and website in cookies. These are for your convenience so that you do not have to fill in your details again when you leave another comment. These cookies will last for one year.</p>
      <p>If you visit our login page, we will set a temporary cookie to determine if your browser accepts cookies. This cookie contains no personal data and is discarded when you close your browser.</p>
      <p>When you log in, we will also set up several cookies to save your login information and your screen display choices. Login cookies last for two days, and screen options cookies last for a year. If you select "Remember Me," your login will persist for two weeks. If you log out of your account, the login cookies will be removed.</p>
      <p>If you edit or publish an article, an additional cookie will be saved in your browser. This cookie includes no personal data and simply indicates the post ID of the article you just edited. It expires after 1 day.</p>

  - heading: "Embedded content from other websites"
    level: 2
    body: |-
      <p>Articles on this site may include embedded content (e.g. videos, images, articles, etc.). Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website.</p>
      <p>These websites may collect data about you, use cookies, embed additional third-party tracking, and monitor your interaction with that embedded content, including tracking your interaction with the embedded content if you have an account and are logged in to that website.</p>

  - heading: "Payments"
    level: 2
    body: |-
      <p>We take payment through Jackrabbit only. When you register or pay, your payment is handled by Jackrabbit's secure system, and some of your data, such as the purchase total and billing information, is passed to Jackrabbit to process or support the payment.</p>
      <p>You can view and manage your registrations and payments through the <a href="https://app.jackrabbitclass.com/ParentPortal/jkanorcal" target="_blank" rel="noopener">parent portal</a>.</p>

  # The "Analytics" section is a heading only; its content lives in the sub-sections below.
  - heading: "Analytics"
    level: 2
    body: ""

  - heading: "Who we share your data with"
    level: 3
    body: |-
      <p>If you register for an event, at your option, you can allow us to share your name with other registered participants on a listing of all divisions and registered participants. If you do not wish to share your name, your name will be shown as "anonymous." This listing of divisions will only show the number of registered participants to site visitors who are not registered with the site.</p>
      <p>We use WooCommerce (<a href="https://woocommerce.com/" target="_blank" rel="noopener">https://woocommerce.com/</a>) for tournament registrations on this site.</p>
      <p>We use Google reCAPTCHA v3 on this site to provide additional security for user logins. The use of reCAPTCHA v3 is subject to the Google Privacy Policy and Terms of Use.</p>
      <p>We may also use Jetpack (<a href="https://jetpack.com/" target="_blank" rel="noopener">https://jetpack.com/</a>) for data analytics on the site.</p>
      <p>Additionally, our server stores logs of all access requests, including your IP address and the page you attempt to access, along with any post data included in that request. This is to diagnose possible problems with the site, as well as to monitor for malicious activity.</p>

  - heading: "What rights you have over your data"
    level: 2
    body: |-
      <p>If you have an account on this site, or have left comments, you can request to receive an exported file of the personal data we hold about you, including any data you have provided to us. You can also request that we erase any personal data we hold about you. This does not include any data we are obliged to keep for administrative, legal, or security purposes.</p>

  - heading: "Where we send your data"
    level: 2
    body: |-
      <p>Visitor comments may be checked through an automated spam detection service. Tournament registrations will be shared by email to the email address you provide, as well as with site administrators.</p>

  - heading: "Your contact information"
    level: 2
    body: |-
      <p>When you register for a tournament through this site, your address, name, and any information you enter in your registration is stored on this site. This information may also be shared with Jackrabbit, our payment processor, when you make a payment.</p>

  - heading: "Data Retention"
    level: 2
    body: |-
      <p>If you leave a comment, the comment and its metadata are retained indefinitely. This is so we can recognize and approve any follow-up comments automatically instead of holding them in a moderation queue.</p>
      <p>For users that register on our website (if any), we also store the personal information they provide in their user profile. All users can see, edit, or delete their personal information at any time (except they cannot change their username). Website administrators can also see and edit that information.</p>
      <p>We do not store any payment, credit card, etc. information on this server. That is all handled through Jackrabbit, our third-party payment processor, and they share only whether the payment is successful with this site.</p>
      <p>We save "inactive" accounts (i.e. accounts that have not been logged in or accessed this site) for 18 months.</p>
      <p>We retain pending, failed, and cancelled orders (registrations) for 30 days.</p>
      <p>We retain completed orders for 3 years.</p>
      <p>Access and error logs are typically stored for up to seven (7) days, but may be stored indefinitely and shared with law enforcement if malicious activity (i.e. attempts to compromise the site or fraudulently obtain login credentials) is detected or suspected.</p>

  - heading: "Who on our team has access"
    level: 2
    body: |-
      <p>Members of our team have access to the information you provide us. For example, both Administrators and Shop Managers can access:</p>
      <ul>
        <li>Order information like what was purchased, when it was purchased, and where it should be sent.</li>
        <li>Customer information like your name, email address, and billing and shipping information.</li>
      </ul>
      <p>Our team members have access to this information to help fulfill orders, process refunds, and support you.</p>

  # The "Additional information" section is a heading only; its content lives in the sub-sections below.
  - heading: "Additional information"
    level: 2
    body: ""

  - heading: "How we protect your data"
    level: 3
    body: |-
      <p>Communication with the server is encrypted if you access the site through HTTPS, and the site uses 128-bit encryption to secure passwords and data shared with the server. Your password is stored as a hash, which may be possible for hackers to decrypt if they obtained access to the servers. Therefore, you should not use the same password on this site as on any other site.</p>

  - heading: "What data breach procedures we have in place"
    level: 3
    body: |-
      <p>We use multiple plugins to attempt to monitor and protect the site from malicious access attempts. We also attempt to keep all software up to date.</p>

  - heading: "What third parties we receive data from"
    level: 3
    body: |-
      <p>When you pay for registrations, we receive confirmation from the payment processor whether the payment was successful, and the shipping address (if applicable) you provided to them.</p>

  - heading: "What automated decision making and / or profiling we do with user data"
    level: 3
    body: |-
      <p>We use some plugins to try to reduce the amount of spam and malicious login attempts. These plugins may share your IP address with public blacklists.</p>

  - heading: "Industry regulatory disclosure requirements"
    level: 3
    body: |-
      <p>If you have any further questions or concerns, please contact us. We'd be happy to hear from you, and even happier if you come and train with us. Osu!</p>
