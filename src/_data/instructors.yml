list:
  - id: wauriman
    rank_kanji: 五段 · Godan
    role: Chief Instructor
    layout: default
    first_name: Wauriman
    last_name: Borges
    photo: /images/sensei/wauriman.png?v=2
    photo_alt: Sensei Wauriman Borges, 5th Dan
    vertical_jp: ワウリマン・ボルジェス
    bio:
      - Wauriman Borges is a 5th Dan and a member of the United States National Team. He trained under Oswaldo Mendonça Jr. Shihan and Yoshizo Machida Shihan, the President of JKA Brazil, a lineage that has carried him to multiple national championships in both the United States and Brazil.
      - His floor is built on a commanding presence in <em>kumite</em>, with a precise <em>mae-geri</em> and a relentless <em>ashi-barai</em> that emphasize power, timing, footwork, and indomitable spirit. In 2024 he represented the USA at the JKA World Championships in Takasaki, Japan, advancing through the first two rounds before facing Japan in round three.
      - "Since taking the helm in San Bruno he has shaped the dojo's culture around personal growth, discipline, and an open door for beginners and competitors alike. Favorite katas: <em>Jitte</em> and <em>Sōchin</em>."
    stats:
      - value: 5th Dan
        value_class: ''
        label: Godan<br>JKA-certified
      - value: Gold
        value_class: ''
        label: National Champion<br>USA & Brazil
      - value: 2 Wins
        value_class: ''
        label: 2024 JKA Worlds<br>Takasaki, Japan
    credentials: Instructor C · Judge C · Examiner D
    plate:
      photo: /images/sensei/wauriman-worlds-maegeri.jpg
      photo_alt: Sensei Wauriman delivers a mae-geri at the 2024 JKA World Championships in Takasaki, Japan
      caption_accent: 2024 JKA World Championships · Takasaki, Japan
      caption: Sensei Wauriman's mae-geri against Japan.
  - id: rahn
    rank_kanji: 四段 · Yondan
    role: Assistant Instructor
    layout: reverse
    first_name: Harrison
    last_name: Rahn
    photo: /images/sensei/harry.png?v=3
    photo_alt: Harrison Rahn, 4th Dan
    vertical_jp: ハリソン・ラーン
    bio:
      - Harry began studying martial arts as a child before taking up shotokan in 2013 at the Tulane Karate Club under Kyriakos and Dimitri Papadopoulos. He joined JKA NorCal in 2018, then spent several months at the JKA World Headquarters in Tokyo preparing for the 2024 World Championships.
      - A two-time Panamerican finalist and World semifinalist, he now helps foster the JKA NorCal Competition Team. He credits karate with the discipline behind every long goal he has set for himself, on the floor and off it.
      - One of his favorite memories is the roar of the US team after his first elimination-round win at the 2023 Panamerican Championships, the moment that crystallized why he keeps competing.
    stats:
      - value: 4th Dan
        value_class: ''
        label: Yondan<br>JKA-certified
      - value: 2×
        value_class: ''
        label: Panamerican<br>Finalist
      - value: 1×
        value_class: ''
        label: World<br>Semifinalist
    credentials: ''
    show_divider_after: true
  - id: yeung
    rank_kanji: 三段 · Sandan
    role: Assistant Instructor
    layout: default
    first_name: Sammi
    last_name: Yeung
    photo: /images/sensei/sammi.png?v=2
    photo_alt: Sammi Yeung, 3rd Dan
    vertical_jp: サミー・ヨン
    bio:
      - Sammi Yeung has more than a decade with JKA NorCal. A women's <em>kumite</em> national champion and four-time United States National Team member, she has represented the country in <em>kata</em>, <em>kumite</em>, and team events at the highest levels of competition.
      - In 2025 she took individual gold in <em>kata</em> at the JKA Panamerican Championships and helped the US Women's team capture their first Team Kata and Team Kumite gold medals. At the 2024 Gichin Funakoshi World Cup the US Women's Team Kata placed 4th globally. Performing on the main tatami under the stadium lights, she remembers the adrenaline and the realization she was living a childhood dream.
      - Having graduated from the JKA-USA youth team to the adult team, she carries a perspective that resonates with younger students chasing the same path. She mentors members of the Competition Team and centers her teaching on a supportive, inclusive community.
    stats:
