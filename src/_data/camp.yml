about:
  label: Hirayama Sensei, 7th Dan
  heading: World Renowned JKA Hombu Dojo Instruction comes to the Bay Area
  photo: /images/camp/camp2025-15-instructor-demo.jpg
  photo_alt: Hirayama Sensei demonstrating a technique to students
  paragraphs:
    - Yuko Hirayama Sensei (7th Dan), as the highest-ranking female among JKA’s instructors, stands today as one of the most respected female leaders in the Shotokan world. Over years of intensive training and teaching, she has built a reputation not only for technical precision but for inspirational leadership—particularly in an era when female competitors were rare in high-level karate. In addition to her technical prowess, her competitive successes had her named Best Competitor at the 45th All Japan Championship, with titles in both kumite and kata.
    - 'Hirayama’s academic background at Tokyo Women’s College of Physical Education, known for being one of Japan’s leading institutions for women’s athletics, added a formal athletic education uncommon among karate instructors of her generation. She has since translated that into a robust teaching presence: whether in domestic or overseas seminars, she is sought after for her ability to balance rigorous technique with motivating support. Her presence as a senior female instructor at JKA Honbu has symbolized opportunity for women in karate, helping break barriers and offering a visible model of achievement in a domain historically dominated by men.'
expect:
  label: What you can expect
  heading: Scenes from last year's camp
  note: October 24-26, 2025
  items:
    - headline: Direct Instruction from a  JKA Headquarters master
      body: Hirayama Sensei leads large group sessions focusing on Kata, Kihon, and Kumite where everyone can receive world class training.
      src: /images/camp/camp2025-09-instructor-boy.jpg
      alt: Sensei Hirayama with two fellow black-belt instructors at the camp
      pos: center 22%
    - headline: Training for All levels Novice to Champion
      body: With up to nine sessions over three days, every karate-ka can build the weekend that fits their goals, from foundational drills to competition prep and refereeing instruction
      src: /images/camp/camp2025-14-sensei-circle.jpg
      alt: Sensei Hirayama leading a session in front of the dojo calligraphy wall
      pos: ''
    - headline: Specialized Sessions for Referees and Competitors
      body: Open the weekend with a workshop-style open mat alongside current and former JKA-USA National Team members and close the weekend with live matches to test your judging and competition skills.
      src: /images/camp/camp2025-05-teaching.jpg
      alt: Sensei Hirayama teaching a group of students
      pos: ''
    - headline: One community Training Together
      body: JKA NorCal welcomes all karate-ka who want to see the highest levels of traditional shotokan. See old friends and make new ones in the west coast karate community.
      src: /images/camp/camp2025-01-group.jpg
      alt: The full camp group photographed together on the dojo floor
      pos: ''
